name: Build, push and deploy

on:
  push:
    branches: [ master, main ]   # this repo uses "master"; "main" is kept in case it is renamed
  workflow_dispatch:

env:
  GATEWAY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-gateway
  FUNCTIONS_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions
  VERSION: v3.${{ github.run_number }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        run: |
          dotnet restore CoffeeNChill.Functions.slnx
          dotnet build CoffeeNChill.Functions.slnx --no-restore -c Release

      - name: Run unit tests
        if: ${{ hashFiles('**/*Tests.csproj') != '' }}
        run: dotnet test CoffeeNChill.Functions.slnx --no-build -c Release

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./CoffeeNChill.Gateway
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ env.VERSION }}
            ${{ env.GATEWAY_IMAGE }}:latest

      - name: Build and push Functions image
        uses: docker/build-push-action@v6
        with:
          context: ./CoffeeNChill.Functions
          push: true
          tags: |
            ${{ env.FUNCTIONS_IMAGE }}:${{ env.VERSION }}
            ${{ env.FUNCTIONS_IMAGE }}:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/coffeenchill
            sed -i "s|coffeenchill-gateway:.*|coffeenchill-gateway:${{ env.VERSION }}|" docker-compose.yml
            sed -i "s|coffeenchill-functions:.*|coffeenchill-functions:${{ env.VERSION }}|" docker-compose.yml
            docker compose pull
            docker compose up -d
