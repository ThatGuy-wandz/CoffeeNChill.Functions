name: CI/CD - Build, test, publish and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  VERSION: v1.${{ github.run_number }}
  FUNCTIONS_IMAGE: coffeenchill-functions
  GATEWAY_IMAGE: coffeenchill-gateway

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CoffeeNChill.Functions.slnx

      - name: Build
        run: dotnet build CoffeeNChill.Functions.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test CoffeeNChill.Gateway.Tests/CoffeeNChill.Gateway.Tests.csproj --configuration Release --no-restore --verbosity normal

  docker:
    name: Build and push Docker images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Functions image
        uses: docker/build-push-action@v6
        with:
          context: ./CoffeeNChill.Functions
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FUNCTIONS_IMAGE }}:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FUNCTIONS_IMAGE }}:latest
          cache-from: type=gha,scope=functions
          cache-to: type=gha,scope=functions,mode=max

      - name: Build and push Gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./CoffeeNChill.Gateway
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.GATEWAY_IMAGE }}:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.GATEWAY_IMAGE }}:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

  deploy:
    name: Deploy to VPS
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to the VPS
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/coffeenchill/docker-compose.yml"

      - name: Pull new images and restart the stack
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
          set -e
          cd ~/coffeenchill
          export IMAGE_TAG="${{ env.VERSION }}"
          export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          docker compose pull && docker compose up -d
          docker image prune -f
          REMOTE

      - name: Smoke test - is the gateway answering?
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ secrets.VPS_HOST }}:5000/swagger/v1/swagger.json" > /dev/null; then
              echo "Gateway is up."; exit 0
            fi
            echo "Not ready yet (attempt $i), waiting..."; sleep 6
          done
          echo "Gateway did not come up in time."; exit 1